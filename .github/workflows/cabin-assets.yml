name: Cabin geometry preparation
on:
  push:
    branches: [cabin-experience]
    paths: ['.github/workflows/cabin-assets.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm run assets && npm run optimize
      - name: Package source and public car geometry for local interaction testing
        run: |
          mkdir -p /tmp/cabin-source/node_modules
          git archive HEAD | tar -x -C /tmp/cabin-source
          cp -r public/models /tmp/cabin-source/public/
          cp -r node_modules/three node_modules/gsap node_modules/meshoptimizer /tmp/cabin-source/node_modules/
          tar -czf cabin-source.tgz -C /tmp/cabin-source .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cabin-source-geometry
          path: cabin-source.tgz
          retention-days: 1
