name: Cabin source review
on:
  push:
    branches: [cabin-experience]
    paths: [.github/workflows/cabin-review-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar.gz --output=cabin-source-review.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cabin-source-review
          path: cabin-source-review.tar.gz
          retention-days: 1
