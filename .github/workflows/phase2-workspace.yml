name: Phase two workspace
on:
  push:
    branches: [configurator-hotspots]
    paths: [.github/workflows/phase2-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Snapshot tracked source only
        run: git archive --format=tar.gz -o /tmp/phase2-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-source
          path: /tmp/phase2-source.tar.gz
          retention-days: 1
