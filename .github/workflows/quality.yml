name: Landing page quality
on:
  push:
    branches: [master, premium-experience, cabin-experience, ui-foundation, configurator-hotspots]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify real car experience
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Report checks
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          try {
            const report = JSON.parse(await fs.readFile('public/diagnostics/premium.json', 'utf8'));
            delete report.servedManifest; delete report.browserManifest;
            if (report.optimization) delete report.optimization.textures;
            console.log('BROWSER_REPORT', JSON.stringify(report));
          } catch(error) { console.log('Browser report not produced:', String(error)); }
          NODE
      - name: Save browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premium-browser-review
          path: public/diagnostics/
          retention-days: 3
          if-no-files-found: warn
