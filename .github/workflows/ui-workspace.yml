name: UI refactor workspace
on:
  push:
    branches: [ui-foundation]
    paths: [.github/workflows/ui-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run assets && npm run optimize
      - name: Package exact source and local verification dependencies
        run: |
          git archive HEAD -o /tmp/ui-source.tar
          tar -rf /tmp/ui-source.tar public/models node_modules/three node_modules/gsap node_modules/react node_modules/react-dom node_modules/scheduler node_modules/typescript node_modules/@types/react node_modules/@types/react-dom node_modules/@types/node node_modules/csstype node_modules/undici-types
          gzip /tmp/ui-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source-workspace
          path: /tmp/ui-source.tar.gz
          retention-days: 1
